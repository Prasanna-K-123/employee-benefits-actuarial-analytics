name: Registered Predictive Reserving
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-predictive.txt
      - run: python -m pip install -r requirements-predictive.txt
      - name: Historical and independent predictive controls
        run: python -m pytest -q
      - name: Replay exact sources, public projections and registered simulation cases
        if: ${{ hashFiles('outputs/predictive_reserving/summary.json') != '' }}
        run: |
          python collect_predictive_sources.py --verify-committed
          python verify_predictive_reserving.py
